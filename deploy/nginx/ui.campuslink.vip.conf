# ui.campuslink.vip —— 静态站点：入口页 /、原页面 /origin、拆解页 /component
#
# 站点内容由 `npm run build` 生成，上传到 /var/www/ui.campuslink.vip（见 scripts/deploy-vps.mjs）。
# 这份文件在服务器上的位置是 /opt/nginx-docker/conf.d/ui，由 /opt/nginx-docker/compose.yml
# 挂载进 nginx 容器；同时要在 /opt/nginx-docker/nginx.conf 的 http 块里加一行
# `include /etc/nginx/conf.d/ui;`（该文件是逐条 include 的，不是 conf.d/*.conf）。

server {
    listen 80;
    server_name ui.campuslink.vip;

    # acme 验证必须排在 301 之前
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-webroot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ui.campuslink.vip;

    ssl_certificate     /etc/letsencrypt/live/ui.campuslink.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.campuslink.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    http2 on;

    root /var/www/ui.campuslink.vip;
    index index.html;
    charset utf-8;

    # 只在这个 vhost 开压缩，不动其它站点。
    # 拆解页的 JS 有 300KB 以上，不压缩就是裸传。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/markdown application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt-webroot; }

    # nginx 的 mime.types 里没有 .md。不显式给类型的话会当成 application/octet-stream
    # 直接下载；不给 charset 的话浏览器会按系统默认编码（中文 Windows 是 GBK）解码，
    # UTF-8 的中文会变成乱码 —— 剪贴板走 fetch().text() 固定 UTF-8，所以只有直接打开地址时才看得出来。
    #
    # 注意不能用 default_type "text/markdown; charset=utf-8"：那样 content_type_len 会带上参数，
    # 后面 gzip_types 的类型匹配就失败（markdown 就不会被压缩）。改成先给类型、再让
    # charset 模块追加编码，两个都能命中。
    location = /component.md {
        default_type text/markdown;
        charset_types text/markdown;
        charset utf-8;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # 带哈希的静态资源可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # 目录入口补斜杠，与静态托管和本地开发服务器的行为一致
    location = /origin { return 301 /origin/; }
    location = /component { return 301 /component/; }

    # 静态多页站点：不做 SPA 回退，未知路径 404
    location / {
        try_files $uri $uri/ =404;
    }
}
